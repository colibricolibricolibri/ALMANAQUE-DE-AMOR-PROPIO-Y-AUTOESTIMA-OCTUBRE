    <style>
        /* Aplicación universal de tipografía serena y legible */
        *, html, body, #root, button, input, select, textarea {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .font-serif-calm {
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif !important;
        }

        .font-script-subtle {
            font-family: 'Alex Brush', cursive !important;
        }

        .font-sergio, .font-bree {
            font-family: 'Cormorant Garamond', 'Playfair Display', serif !important;
        }

        html, body, #root {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        body {
            color: #2E2721;
            background-color: #FAF8F5; /* Tono arena suave */
        }
        
        /* Estilo para títulos y frases destacadas: Dorado apagado y sereno en Serif elegante */
        .yellow-outlined {
            color: #9E7634 !important;
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif !important;
            letter-spacing: 0.03em;
            -webkit-text-stroke: 0 !important;
            text-shadow: 0 1px 8px rgba(158, 118, 52, 0.12);
        }

        @media (min-width: 768px) {
            .yellow-outlined {
                color: #9E7634 !important;
                -webkit-text-stroke: 0 !important;
                text-shadow: 0 2px 12px rgba(158, 118, 52, 0.15);
            }
        }

        /* Estilo para textos en terracota suave y cálido */
        .red-yellow-outlined {
            color: #A85A48 !important;
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif !important;
            -webkit-text-stroke: 0 !important;
            text-shadow: 0 1px 4px rgba(168, 90, 72, 0.10);
        }

        /* Estilos de color para textos */
        .text-outline-red {
            color: #A85A48 !important;
        }

        .text-outline-black {
            color: #2E2721 !important;
        }

        /* Animaciones */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(0.8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes spin-slow {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
          animation: spin-slow 22s linear infinite;
        }
        .animate-fade-in {
          animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        
        @keyframes marquee {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .animate-marquee {
          display: inline-block;
          white-space: nowrap;
          animation: marquee 20s linear infinite;
        }
        
        .scroll-reveal {
          opacity: 0;
          transform: translateY(16px);
          transition: all 0.6s ease-out;
        }
        .scroll-reveal.visible {
          opacity: 1;
          transform: translateY(0);
        }

        /* Respiración suave consciente */
        @keyframes gentle-breath {
          0%, 100% { transform: scale(1); opacity: 0.9; }
          50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-gentle-breath {
          animation: gentle-breath 7s ease-in-out infinite;
        }
        
        ::-webkit-scrollbar {
          width: 8px;
        }
        ::-webkit-scrollbar-track {
          background: #F5EFEB;
        }
        ::-webkit-scrollbar-thumb {
          background: #DED3C4;
          border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #CCA86E;
        }

        /* Letra capitular editorial y noble en tono terracota cálido */
        .capitular::first-letter {
            color: #A85A48 !important;
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif !important;
            font-weight: 700;
            -webkit-text-stroke: 0 !important;
            text-shadow: none !important;
        }

        /* Estilos Glassmorphism Premium estilo iOS / Nordic Zen */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 20px 50px -12px rgba(46, 39, 33, 0.08), 0 1px 1px rgba(255, 255, 255, 0.95) inset;
        }

        .glass-widget {
            background: rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 16px 36px -8px rgba(46, 39, 33, 0.06), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
        }

        .glass-dock {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px -10px rgba(46, 39, 33, 0.12), 0 1px 2px rgba(255, 255, 255, 0.9) inset;
        }

        /* Barras de onda sonora animadas */
        @keyframes soundWave {
            0%, 100% { height: 4px; }
            50% { height: 22px; }
        }
        .wave-bar-1 { animation: soundWave 1.1s ease-in-out infinite; }
        .wave-bar-2 { animation: soundWave 0.8s ease-in-out infinite 0.2s; }
        .wave-bar-3 { animation: soundWave 1.4s ease-in-out infinite 0.4s; }
        .wave-bar-4 { animation: soundWave 0.9s ease-in-out infinite 0.1s; }
        .wave-bar-5 { animation: soundWave 1.3s ease-in-out infinite 0.3s; }
        .wave-bar-6 { animation: soundWave 0.7s ease-in-out infinite 0.5s; }
        .wave-bar-7 { animation: soundWave 1.2s ease-in-out infinite 0.2s; }
        .wave-bar-8 { animation: soundWave 1.0s ease-in-out infinite 0.4s; }
    </style>
    <script>
      window.addEventListener('scroll', () => {
        document.querySelectorAll('.scroll-reveal').forEach(el => {
          const rect = el.getBoundingClientRect();
          if (rect.top < window.innerHeight * 0.95) {
            el.classList.add('visible');
          }
        });
      });
      window.addEventListener('load', () => {
        setTimeout(() => window.dispatchEvent(new Event('scroll')), 200);
      });
    </script>
